services:
  - type: web
    name: mak-ai-business-assistant-api
    runtime: node
    plan: free
    rootDir: ai-business-assistant/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://mithleshaddhyankendram.github.io
